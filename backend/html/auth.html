<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .modal-container {
            background-color: #0a0a0a;
            width: 90%;
            max-width: 420px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #1a1a1a;
        }

        .modal-header {
            padding: 24px;
            display: flex;
            justify-content: space-between;
        }

        .header-content {
            display: flex;
            gap: 16px;
        }

        .icon-box {
            background-color: #f0f0f0;
            width: 44px;
            height: 44px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .title-group h2 {
            color: #fff;
            margin: 0;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .title-group p {
            color: #888;
            margin: 4px 0 0;
            font-size: 0.9rem;
        }

        .title-group span {
            color: #fff;
            font-weight: 600;
        }

        .close-x {
            color: #666;
            font-size: 20px;
            cursor: pointer;
        }

        .modal-body {
            padding: 0 24px 32px;
        }

        .instruction {
            color: #777;
            font-style: italic;
            font-size: 0.85rem;
            margin-bottom: 24px;
            display: block;
        }

        /* --- Functional Checkbox Logic --- */
        .permission-item {
            display: flex;
            gap: 16px;
            cursor: pointer;
            user-select: none;
        }

        /* Hide default checkbox */
        .permission-item input {
            display: none;
        }

        /* Custom Box */
        .custom-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid #333;
            border-radius: 4px;
            flex-shrink: 0;
            margin-top: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        /* Checked State Styling */
        .permission-item input:checked+.custom-checkbox {
            background-color: #fff;
            border-color: #fff;
        }

        .permission-item input:checked+.custom-checkbox::after {
            content: '✓';
            color: #000;
            font-size: 14px;
            font-weight: bold;
        }

        .text-content h4 {
            color: #fff;
            margin: 0;
            font-size: 0.95rem;
        }

        .text-content p {
            color: #666;
            margin: 4px 0 0;
            font-size: 0.85rem;
        }

        /* Footer */
        .modal-footer {
            padding: 16px 24px;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            border-top: 1px solid #1a1a1a;
        }

        .btn {
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .btn-cancel {
            background: transparent;
            color: #fff;
            border: 1px solid #333;
        }

        .btn-allow {
            background: #fff;
            color: #000;
        }

        .btn:active {
            opacity: 0.7;
        }
    </style>
</head>

<body>

    <div class="modal-container">
        <div class="modal-header">
            <div class="header-content">
                <div class="icon-box">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    </svg>
                </div>
                <div class="title-group">
                    <h2>Permission Request</h2>
                    <p><span>One New</span> is requesting access...</p>
                </div>
            </div>
            <div class="close-x">&times;</div>
        </div>

        <div class="modal-body">
            <span class="instruction">Select the data you are comfortable sharing:</span>

            <label class="permission-item">
                <input type="checkbox" checked>
                <div class="custom-checkbox"></div>
                <div class="text-content">
                    <h4>Read Profile</h4>
                    <p>Access your name, avatar, and bio.</p>
                </div>
            </label>
        </div>

        <div class="modal-footer">
            <button class="btn btn-cancel" onclick="window.close()">Cancel</button>
            <button class="btn btn-allow" onclick="alert('Access Granted')">Allow Access</button>
        </div>
    </div>

</body>

</html>

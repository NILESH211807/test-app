server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
        http:

ingester:
  lifecycler:
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1

querier:
  max_concurrent_queries: 20

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/traces